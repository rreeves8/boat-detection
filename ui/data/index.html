<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Footage / daily view</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #101315;
        color: #edf1ee;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      header {
        padding: 30px 32px 24px;
        border-bottom: 1px solid #303837;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
      }
      h1 {
        margin: 8px 0;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -1px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 2px;
        color: #a3c9b4;
        text-transform: uppercase;
      }
      p {
        color: #a0aaa4;
        font-size: 13px;
      }
      button {
        background: #b7e0c7;
        border: 0;
        border-radius: 5px;
        padding: 11px 17px;
        cursor: pointer;
        font-weight: 600;
        color: #15291d;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .login {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .login input {
        width: 100%;
        background: #101315;
        border: 1px solid #2a332e;
        border-radius: 6px;
        color: #edf1ee;
        padding: 12px;
        font-size: 14px;
        text-align: center;
      }
      .login button {
        width: 100%;
      }
      .modal-card.login-card {
        width: min(300px, 90vw);
        padding: 32px 28px;
        text-align: center;
      }
      .login-title {
        font-size: 19px;
        font-weight: 500;
        margin: 0 0 6px;
      }
      .login-sub {
        color: #97a29b;
        font-size: 13px;
        line-height: 1.45;
        margin: 0 0 22px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
      }
      .date-jump {
        margin-left: auto;
      }
      .secondary {
        background: #27332c;
        color: #d7e5db;
      }
      main {
        padding: 12px 32px 40px;
      }
      .day {
        margin-top: 28px;
      }
      .day-heading {
        display: flex;
        gap: 14px;
        align-items: baseline;
        border-bottom: 1px solid #303837;
        margin-bottom: 14px;
        padding-bottom: 12px;
      }
      .day h2 {
        font-size: 18px;
        font-weight: 500;
        margin: 0;
      }
      .count {
        font-size: 12px;
        color: #87978c;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 14px;
      }
      figure {
        margin: 0;
        min-width: 0;
        background: #1b211e;
        border: 1px solid #303b34;
        border-radius: 6px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      video {
        display: block;
        width: 100%;
        aspect-ratio: 16/9;
        background: #080b09;
        object-fit: cover;
      }
      figcaption {
        padding: 10px 10px 6px;
        font-size: 12px;
        color: #bccbc1;
      }
      .caption-main {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .analysis {
        padding: 0 10px 12px;
        font-size: 11px;
        border-top: 1px solid #263029;
        margin-top: 4px;
        padding-top: 10px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .badge.boat {
        background: #1f3d2a;
        color: #8fe6ab;
      }
      .badge.wake_only {
        background: #3d3320;
        color: #e6c98f;
      }
      .badge.empty {
        background: #2a2f2c;
        color: #8a938d;
      }
      .badge.pending {
        background: #242a27;
        color: #6a746e;
      }
      .badge.view {
        background: #1f2d3d;
        color: #8fbfe6;
        cursor: pointer;
      }
      .badge.view:hover {
        background: #294056;
      }
      .video-wrap {
        position: relative;
        line-height: 0;
      }
      .overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: none;
      }
      .thumb {
        cursor: pointer;
      }
      .modal[hidden] {
        display: none;
      }
      .modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.72);
      }
      .modal-card {
        position: relative;
        z-index: 1;
        background: #121714;
        border: 1px solid #303b34;
        border-radius: 10px;
        width: min(880px, 95vw);
        max-height: 92vh;
        overflow: auto;
        padding: 16px;
      }
      .modal-close {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 2;
        width: 32px;
        height: 32px;
        padding: 0;
        font-size: 15px;
        line-height: 1;
        background: #27332c;
        color: #d7e5db;
      }
      .modal .video-wrap {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 8px;
        overflow: hidden;
        background: #000;
      }
      .modal video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .modal-title {
        font-size: 13px;
        color: #bccbc1;
        margin: 12px 2px 8px;
        word-break: break-all;
      }
      .modal-json {
        margin: 0;
        max-height: 42vh;
        overflow: auto;
        padding: 12px;
        background: #0c0f0d;
        border: 1px solid #263029;
        border-radius: 6px;
        font-size: 11px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
        color: #cfe0d5;
      }
      .boat-line {
        color: #cfe0d5;
        margin-top: 7px;
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      .dir {
        font-weight: 600;
        font-size: 13px;
        color: #b7e0c7;
      }
      .meta {
        color: #8a978e;
      }
      .analysis-note {
        margin-top: 7px;
        color: #8a978e;
      }
      .message {
        padding: 48px 0;
        color: #a0aaa4;
      }
      #status {
        min-height: 20px;
      }
      @media (max-width: 700px) {
        header {
          padding: 22px 16px;
          align-items: flex-start;
          flex-direction: column;
        }
        main {
          padding: 0 16px 30px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="eyebrow">
          <a href="../" style="color: inherit; text-decoration: none">&larr; Overview</a>
          &nbsp;·&nbsp; Footage archive
        </div>
        <h1>Footage by day.</h1>
        <p id="summary">Connecting to your footage…</p>
        <p id="status" role="status" aria-live="polite">Loading videos…</p>
      </div>
    </header>
    <nav
      class="toolbar"
      aria-label="Video pages"
      style="padding: 20px 32px; align-items: center"
    >
      <button id="previous" class="secondary" disabled>Next day</button
      ><span id="page-label">Page 1</span
      ><button id="next" class="secondary" disabled>Previous day</button
      ><input id="date-jump" class="date-jump" type="date" aria-label="Jump to date" />
    </nav>
    <main id="gallery"><div class="message">Loading the archive…</div></main>
    <div id="modal" class="modal" hidden>
      <div class="modal-backdrop"></div>
      <div class="modal-card" role="dialog" aria-modal="true">
        <button id="modal-close" class="modal-close" aria-label="Close">&#10005;</button>
        <div class="video-wrap">
          <video id="modal-video" controls muted playsinline></video>
          <canvas id="modal-overlay" class="overlay"></canvas>
        </div>
        <div id="modal-title" class="modal-title"></div>
        <pre id="modal-json" class="modal-json"></pre>
      </div>
    </div>
    <div id="login-modal" class="modal" hidden>
      <div class="modal-backdrop"></div>
      <div class="modal-card login-card" role="dialog" aria-modal="true" aria-label="Log in">
        <h2 class="login-title">Enter passphrase</h2>
        <p class="login-sub">The footage is private. Enter the passphrase to watch.</p>
        <form class="login" method="POST" action="https://login.magnusreeves.com/">
          <input
            type="password"
            name="password"
            placeholder="Passphrase"
            aria-label="Passphrase"
            autocomplete="current-password"
          />
          <button type="submit">Unlock &rarr;</button>
        </form>
      </div>
    </div>
    <script>
      const gallery = document.querySelector("#gallery");
      const status = document.querySelector("#status");
      const previous = document.querySelector("#previous");
      const next = document.querySelector("#next");
      const dateJump = document.querySelector("#date-jump");
      const loginModal = document.getElementById("login-modal");
      let authed = null;

      // Blocking, non-dismissable: when auth fails this is all the user sees.
      function showLoginModal() {
        loginModal.hidden = false;
        loginModal.querySelector("input")?.focus();
      }

      // One request to test access before loading a day of videos. If the sample
      // clip is 403 we're not logged in — nothing else is shown, just the modal.
      async function checkAuth(sampleUrl) {
        if (authed !== null) return authed;
        try {
          const r = await fetch(sampleUrl, {
            headers: { Range: "bytes=0-0" },
            cache: "no-store",
          });
          authed = r.status === 200 || r.status === 206;
        } catch (_) {
          authed = false;
        }
        return authed;
      }
      let currentDay = new Date();
      currentDay.setDate(currentDay.getDate() - 1);
      const dayString = (date) => {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      };
      const displayDay = (day) => new Intl.DateTimeFormat("en-US", {
        dateStyle: "full",
        timeZone: TIMEZONE,
      }).format(new Date(`${day}T12:00:00`));
      const TIMEZONE = "America/Toronto";
      // Video clips are same-origin object paths in both environments: Cloud CDN
      // serves them in production (gated by the signed cookie); serve.py proxies
      // them from the private bucket with your gcloud credentials when running
      // locally. The analysis records, however, come from the public Supabase
      // `clips` table (anon has SELECT only) — see counting/schema.sql.
      const SUPABASE_URL = "https://qtexafttduxkoxzalihr.supabase.co";
      const SUPABASE_KEY = "sb_publishable_FX1AlLYc2ikyemuukF954w_K_wk81OR";
      let players = [];
      previous.addEventListener("click", () => { currentDay.setDate(currentDay.getDate() + 1); load(); });
      next.addEventListener("click", () => { currentDay.setDate(currentDay.getDate() - 1); load(); });
      dateJump.addEventListener("change", () => {
        if (!dateJump.value) return;
        const [year, month, day] = dateJump.value.split("-").map(Number);
        currentDay = new Date(year, month - 1, day);
        load();
      });
      const formatDuration = (milliseconds) => {
        if (!milliseconds) return "Unknown duration";
        const totalSeconds = Math.round(milliseconds / 1000);
        return `${Math.floor(totalSeconds / 60)}:${String(totalSeconds % 60).padStart(2, "0")}`;
      };

      function renderAnalysis() {
        // Every listed clip is in the table (analyzed). The "view" tag opens the
        // modal, which plays the video with the tracked box + a record summary.
        const wrap = document.createElement("div");
        wrap.className = "analysis";
        const tag = document.createElement("span");
        tag.className = "badge view";
        tag.textContent = "view";
        wrap.append(tag);
        return wrap;
      }

      // Draw each object's tracked box onto a canvas over the video, synced to
      // playback, so clicking "output" replays what the detector found moving.
      function makeOverlay(video, canvas, getRecord) {
        const ctx = canvas.getContext("2d");
        let raf = 0;
        function draw() {
          const w = video.clientWidth;
          const h = video.clientHeight;
          if (canvas.width !== w) canvas.width = w;
          if (canvas.height !== h) canvas.height = h;
          ctx.clearRect(0, 0, w, h);
          const record = getRecord();
          if (!record) return;
          const fps = record.fps || 15;
          const objects = record.objects || [];
          const frame = video.currentTime * fps;
          ctx.lineWidth = 2;
          ctx.strokeStyle = "#8fe6ab";
          ctx.fillStyle = "#8fe6ab";
          ctx.font = "600 12px Inter, system-ui, sans-serif";
          for (const obj of objects) {
            const path = obj.track;
            if (!path || !path.length) continue;
            // Nearest tracked sample to the current instant; skip if the object
            // wasn't detected around now (so no stale box lingers).
            let best = null;
            let bestGap = Infinity;
            for (const s of path) {
              const gap = Math.abs(s[0] - frame);
              if (gap < bestGap) { bestGap = gap; best = s; }
            }
            if (!best || bestGap > 6) continue;
            const x = best[1] * w;
            const y = best[2] * h;
            ctx.strokeRect(x, y, best[3] * w, best[4] * h);
          }
        }
        function loop() {
          draw();
          if (!video.paused && !video.ended) raf = requestAnimationFrame(loop);
        }
        video.addEventListener("play", () => {
          canvas.style.display = "block";
          cancelAnimationFrame(raf);
          loop();
        });
        video.addEventListener("pause", draw);
        video.addEventListener("seeked", () => {
          if (canvas.style.display === "block") draw();
        });
        video.addEventListener("ended", draw);
      }

      // ---- detail modal: play the clip with its tracked box + raw record -----
      const modal = document.getElementById("modal");
      const modalVideo = document.getElementById("modal-video");
      const modalOverlay = document.getElementById("modal-overlay");
      const modalJson = document.getElementById("modal-json");
      const modalTitle = document.getElementById("modal-title");
      let modalRecord = null;
      makeOverlay(modalVideo, modalOverlay, () => modalRecord);

      // A readable summary of the record -- omits the per-frame track arrays
      // (used to move the box) that would otherwise bloat the panel.
      function summarizeRecord(record) {
        if (!record) return "(not analyzed)";
        const res = record.resolution
          ? `${record.resolution[0]}×${record.resolution[1]}`
          : "?";
        const n = record.moving_count || 0;
        const lines = [
          `${n} moving object${n === 1 ? "" : "s"}`,
          `clip: ${record.total_frames} frames @ ${record.fps} fps · ${res}`,
        ];
        (record.objects || []).forEach((o, i) => {
          const box = (o.box || []).join(", ");
          lines.push(
            `object ${i + 1}: box [${box}] · seen ${o.frames_visible} frames · travel ${o.travel}`,
          );
        });
        return lines.join("\n");
      }

      async function openModal(item) {
        modalRecord = null;
        modalTitle.textContent = item.name;
        modalJson.textContent = "loading…";
        modal.hidden = false;
        modalVideo.src = item.url;
        modalVideo.currentTime = 0;
        modalVideo.play().catch(() => {});
        // Fetch this clip's full row (objects/track) only now that it's opened.
        try {
          const url =
            `${SUPABASE_URL}/rest/v1/clips?select=*&name=eq.${encodeURIComponent(item.name)}`;
          const r = await fetch(url, {
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
            cache: "no-store",
          });
          modalRecord = r.ok ? (await r.json())[0] || null : null;
        } catch (_) {
          modalRecord = null;
        }
        modalJson.textContent = summarizeRecord(modalRecord);
      }
      function closeModal() {
        modalVideo.pause();
        modalVideo.removeAttribute("src");
        modalVideo.load();
        modalOverlay.style.display = "none";
        modal.hidden = true;
        modalRecord = null;
      }
      document.getElementById("modal-close").addEventListener("click", closeModal);
      document.querySelector(".modal-backdrop").addEventListener("click", closeModal);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !modal.hidden) closeModal();
      });

      async function publicCatalog(day) {
        // The day's clips come straight from Supabase. Records are already
        // daytime-only (the counting pipeline filters with is_daytime), so no
        // extra daylight filtering here. Lightweight columns only -- the modal
        // fetches the full row (objects/track) on demand.
        const url =
          `${SUPABASE_URL}/rest/v1/clips` +
          `?select=name,moving_count&name=like.${day}_*&order=name.asc`;
        const response = await fetch(url, {
          headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
          cache: "no-store",
        });
        if (!response.ok) throw new Error(`Supabase ${response.status}`);
        const rows = await response.json();
        const formatter = new Intl.DateTimeFormat("en-CA", {
          timeZone: TIMEZONE,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        });
        return rows.map((row) => {
          const stampText = row.name.split("/").pop().slice(0, 19);
          const stamp = new Date(
            stampText.replace("_", "T").replace(/-(\d{2})-(\d{2})$/, ":$1:$2") + "Z",
          );
          const parts = Object.fromEntries(
            formatter.formatToParts(stamp).map((part) => [part.type, part.value]),
          );
          return {
            name: row.name,
            recordedAt: stamp.toISOString(),
            time: `${parts.hour}:${parts.minute}:${parts.second}`,
            url: `/${encodeURIComponent(row.name)}`,
            moving_count: row.moving_count,
          };
        });
      }
      // Only attach a clip's source once its card scrolls near the viewport, so
      // a day with dozens of clips doesn't open every <video> (and its metadata
      // fetch through the proxy) up front. Recreated per load() so it never
      // holds references to cards from a previous day.
      let lazyObserver = null;
      function observeLazyVideo(video) {
        lazyObserver.observe(video);
      }

      async function load() {
        players.forEach((video) => {
          video.removeAttribute("src");
          video.load();
        });
        players = [];
        if (lazyObserver) lazyObserver.disconnect();
        lazyObserver = new IntersectionObserver(
          (entries, observer) => {
            for (const entry of entries) {
              if (!entry.isIntersecting) continue;
              const video = entry.target;
              if (!video.src && video.dataset.src) video.src = video.dataset.src;
              observer.unobserve(video);
            }
          },
          { rootMargin: "600px 0px" },
        );
        previous.disabled = next.disabled = true;
        gallery.replaceChildren();
        status.textContent = "Loading videos…";
        try {
          const day = dayString(currentDay);
          const videos = await publicCatalog(day);
          previous.disabled = false;
          next.disabled = false;
          previous.textContent = "Next day";
          next.textContent = "Previous day";
          document.querySelector("#page-label").textContent = displayDay(day);
          dateJump.value = day;
          gallery.replaceChildren();
          document.querySelector("#summary").textContent =
            `${videos.length} daytime clips / oldest first / ${TIMEZONE}`;
          if (!videos.length) {
            gallery.textContent = "No footage is available in this bucket yet.";
            status.textContent = "No videos available.";
            return;
          }
          // Probe once. Not logged in -> show only the login modal, nothing else.
          await checkAuth(videos[0].url);
          if (!authed) {
            gallery.replaceChildren();
            status.textContent = "";
            showLoginModal();
            return;
          }
          const section = document.createElement("section");
          section.className = "day";
          const heading = document.createElement("div");
          heading.className = "day-heading";
          const title = document.createElement("h2");
          title.textContent = new Intl.DateTimeFormat("en-US", {
            dateStyle: "full",
            timeZone: "UTC",
          }).format(new Date(day + "T12:00:00Z"));
          const count = document.createElement("span");
          count.className = "count";
          count.textContent = `${videos.length} clips`;
          heading.append(title, count);
          section.append(heading);

          const grid = document.createElement("div");
          grid.className = "grid";
          for (const item of videos) {
            const card = document.createElement("figure");
            card.title = item.name;
            const video = document.createElement("video");
            video.controls = false;
            video.muted = true;
            video.defaultMuted = true;
            video.playsInline = true;
            video.setAttribute("aria-label", `${day} ${item.time}`);
            video.preload = "metadata";
            video.dataset.src = item.url;

            const caption = document.createElement("figcaption");
            const time = document.createElement("time");
            time.dateTime = item.recordedAt;
            time.textContent = item.time;
            const mainCaption = document.createElement("div");
            mainCaption.className = "caption-main";
            const duration = document.createElement("span");
            duration.textContent = "…";
            mainCaption.append(time, duration);
            caption.append(mainCaption);

            video.addEventListener("loadedmetadata", () => {
              duration.textContent = formatDuration(
                Number.isFinite(video.duration) ? video.duration * 1000 : 0,
              );
              video.currentTime = Math.min(0.1, video.duration / 2);
            });
            video.addEventListener(
              "seeked",
              () => {
                try {
                  const canvas = document.createElement("canvas");
                  canvas.width = video.videoWidth;
                  canvas.height = video.videoHeight;
                  canvas.getContext("2d").drawImage(video, 0, 0);
                  video.poster = canvas.toDataURL("image/jpeg", 0.72);
                  video.pause();
                } catch (_) {}
              },
              { once: true },
            );

            video.classList.add("thumb");
            video.addEventListener("click", () => openModal(item));

            const analysisEl = renderAnalysis();
            analysisEl
              .querySelector(".badge.view")
              .addEventListener("click", () => openModal(item));

            card.append(video, caption, analysisEl);
            grid.append(card);
            players.push(video);
            observeLazyVideo(video);
          }
          section.append(grid);
          gallery.append(section);
          status.textContent = "Select any video to play it.";
        } catch (error) {
          gallery.textContent = error.message;
          status.textContent = "Unable to load footage. Reload to retry.";
        }
      }
      load();
    </script>
  </body>
</html>
